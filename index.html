<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Food Safety Walk</title>
<style>
:root{color-scheme:light;--bg:#fff;--ink:#1a1a1a;--mute:#5f6670;--line:#d9dce1;--blue:#003399;--yel:#ffcc00;--ok:#1f7a4d;--bad:#b3261e;--nabg:#eef0f3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:0 14px 40px}
.top{position:sticky;top:env(safe-area-inset-top,0px);margin:0 -14px 14px;padding:12px 14px 10px;background:#fff;border-bottom:3px solid var(--yel);z-index:5}
h1{font-size:22px;margin:0 0 2px;letter-spacing:-.01em;color:var(--blue)}
.sub{color:var(--mute);margin:0 0 10px;font-size:14px}
.bar{height:8px;background:var(--nabg);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--blue);transition:width .25s}
#prog{font-size:13px;color:var(--mute);margin-top:6px}
details.card{background:#fff;border:1px solid var(--line);border-radius:8px;margin:0 0 12px;overflow:hidden}
details.card.done{border-color:var(--blue)}
summary{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px;font-weight:700;font-size:17px;cursor:pointer;list-style:none;color:var(--blue)}
summary::-webkit-details-marker{display:none}
.cnt{font-size:13px;font-weight:600;color:var(--mute);background:var(--nabg);border-radius:20px;padding:3px 10px;white-space:nowrap}
.done .cnt{background:var(--blue);color:#fff}
.hint{margin:0;padding:0 14px 10px;font-size:13px;color:var(--mute)}
.body{padding:0 14px 14px}
.q{padding:12px 0;border-top:1px solid var(--line)}
.q.flag{border-left:4px solid var(--bad);padding-left:10px}
.q p{margin:0 0 8px}
.opts{display:flex;gap:8px}
.opts button{flex:1;min-height:44px;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:6px;font:inherit;font-weight:600}
.opts button.on[data-v="Yes"]{background:var(--ok);border-color:var(--ok);color:#fff}
.opts button.on[data-v="No"]{background:var(--bad);border-color:var(--bad);color:#fff}
.opts button.on[data-v="N/A"]{background:var(--nabg);border-color:var(--mute);color:var(--ink)}
.temp{display:flex;align-items:center;gap:8px}
.temp input{width:110px}
.hi{color:var(--bad)}
input,textarea{width:100%;font:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:6px;padding:10px}
textarea{min-height:70px;resize:vertical}
.qn{margin-top:8px;display:none}
.q.flag .qn{display:block;border-color:var(--bad)}
label.l{display:block;font-weight:600;font-size:14px;margin:14px 0 6px;color:var(--blue)}
.photos{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.ph{position:relative;width:88px;height:88px}
.ph img{width:100%;height:100%;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.ph button{position:absolute;top:-6px;right:-6px;width:26px;height:26px;border-radius:50%;border:0;background:var(--blue);color:#fff;font-size:16px;line-height:1}
.add{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border:1.5px dashed var(--blue);color:var(--blue);border-radius:6px;font-weight:600;cursor:pointer}
.q .add{display:none;margin-top:8px}.q.pho .add,.q.flag .add{display:inline-flex}
.pdf{width:100%;min-height:52px;margin-top:8px;border:0;border-radius:6px;background:var(--yel);color:var(--blue);font:inherit;font-weight:700}
.pdf:disabled{opacity:.45}
.reset{width:100%;min-height:44px;margin-top:16px;border:1.5px solid var(--line);border-radius:6px;background:#fff;color:var(--mute);font:inherit;font-weight:600}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#003399">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Safety Walk">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<script src="jspdf.umd.min.js"></script>
</head>
<body>
<div class="wrap">
<div class="top">
<h1>Food Safety Walk</h1>
<p class="sub">Tap an answer for every question. Add a photo or comment wherever something needs attention.</p>
<div class="bar"><i id="fill"></i></div>
<div id="prog"></div>
</div>
<main id="app"></main>
<button class="pdf" id="pdf" disabled>Create PDF (finish all sections first)</button>
<p id="msg" role="status" style="margin:8px 0 0;font-size:14px;min-height:20px"></p>
<button class="reset" id="reset">Start new walk</button>
</div>
<script>
var SECS=[{"id": "s0", "t": "Chiller 1: Salad chiller", "h": "Veg, salad, customer salads, prawns, gravlax", "qs": [{"q": "Chiller temp (°C, max 5)", "temp": 1}, {"q": "Date stickers correct and FIFO rotated?"}, {"q": "All items in date?"}, {"q": "Veg (capsicum, cucumber, tomato, onion) fresh, no spoilage?", "p": 1}, {"q": "Spinach and salad leaf in date, no slime or bugs?", "p": 1}, {"q": "Customer salads labelled, in date and FIFO rotated?", "p": 1}, {"q": "Defrosting prawns labelled with thaw date and FIFO rotated?", "p": 1}, {"q": "Veggie dogs and gravlax labelled, in date and FIFO rotated?"}, {"q": "Raw kept separate from ready-to-eat?"}, {"q": "Chiller clean?", "p": 1}]}, {"id": "s1", "t": "Fruit and Veg Treatment", "h": "Salad and Vegetable Wash Procedure", "qs": [{"q": "Wash procedure followed in full?"}, {"q": "Is vegetable wash available?", "p": 1}, {"q": "Sink, colander and equipment clean?", "p": 1}, {"q": "Salad leaf inspected leaf by leaf for bugs?", "p": 1}, {"q": "Washed product drained, covered and dated?", "p": 1}, {"q": "Can coworker explain the wash procedure?"}]}, {"id": "s2", "t": "Chiller 2", "h": "Cakes, drinks, prepped salads, lingonberry jam, yoghurt, sauces", "qs": [{"q": "Chiller temp (°C, max 5)", "temp": 1}, {"q": "Date stickers correct and FIFO rotated?", "p": 1}, {"q": "All items in date?"}, {"q": "Cakes and prepped salads labelled, in date and FIFO rotated?", "p": 1}, {"q": "Yoghurt, jam and sauces in date, opened items dated?"}, {"q": "Opened items sealed, labelled and dated?"}, {"q": "Chiller clean?", "p": 1}]}, {"id": "s3", "t": "Chiller 3: Defrost chiller", "h": "Coworker food and thawing items, attached to walk-in freezer", "qs": [{"q": "Chiller temp (°C, max 5)", "temp": 1}, {"q": "Date stickers and thaw dates correct, FIFO rotated?", "p": 1}, {"q": "Defrosting/Thawing items (rice, dahl, creamed spinach, salmon) within date?", "p": 1}, {"q": "Coworker food separate and labelled?", "p": 1}, {"q": "Freezer door seal and floor clear of ice?", "p": 1}, {"q": "Chiller clean?", "p": 1}]}, {"id": "s4", "t": "Freezer", "h": "", "qs": [{"q": "Date stickers correct and FIFO rotated?", "p": 1}]}, {"id": "s5", "t": "Dry storage", "h": "Fruit and all ambient items", "qs": [{"q": "All items in date, FIFO rotated?", "p": 1}, {"q": "Fruit fresh, no mould?", "p": 1}, {"q": "Stock off the floor?"}, {"q": "Opened items sealed, labelled and dated?"}, {"q": "Area clean and dry?", "p": 1}]}, {"id": "s6", "t": "Coworker restaurant fridge", "h": "Coworker lunches and milk for the coffee machine", "qs": [{"q": "Fridge temp (°C, max 5)", "temp": 1}, {"q": "Old or unlabelled lunches cleared?", "p": 1}, {"q": "Fridge clean?", "p": 1}]}];
var S={a:{},t:{},qn:{},n:{},p:{},m:{name:"",actions:""}};
function hash(s){var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return String(h)}
var VER=hash(JSON.stringify(SECS)),FRESH=false;
try{var r=localStorage.getItem("fsw3");if(r){var o=JSON.parse(r);if(o.v===VER){for(var k in o)S[k]=o[k]}else FRESH=true;S.p={};}}catch(e){}
function save(){try{var c={v:VER,a:S.a,t:S.t,qn:S.qn,n:S.n,m:S.m};localStorage.setItem("fsw3",JSON.stringify(c));}catch(e){}}
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function qhtml(id,q){
var o=typeof q==="string"?{q:q}:q,v=S.a[id],h='<div class="q'+(v==="No"?" flag":"")+(o.p?" pho":"")+'" id="q-'+id+'"><p>'+esc(o.q)+'</p>';
if(o.temp){h+='<div class="temp"><input type="number" inputmode="decimal" step="0.1" placeholder="°C" data-t="'+id+'" value="'+esc(S.t[id])+'"><span id="tw-'+id+'"></span></div>'}
else{h+='<div class="opts">';["Yes","No","N/A"].forEach(function(x){h+='<button data-q="'+id+'" data-v="'+x+'" class="'+(v===x?"on":"")+'">'+x+'</button>'});h+='</div>'}
return h+'<div class="photos" id="ph-'+id+'"></div><label class="add">📷 Add photo<input type="file" accept="image/*" multiple hidden data-p="'+id+'"></label><textarea class="qn" placeholder="What is the issue? What was done about it?" data-qn="'+id+'">'+esc(S.qn[id])+'</textarea></div>';
}
function build(){
var h="";
SECS.forEach(function(s,i){
h+='<details class="card" id="sec-'+s.id+'"'+(i==0?" open":"")+'><summary><span>'+esc(s.t)+'</span><span class="cnt" id="cnt-'+s.id+'"></span></summary><p class="hint">'+esc(s.h)+'</p><div class="body">';
s.qs.forEach(function(q,j){h+=qhtml(s.id+j,q)});
h+='<label class="l" for="n-'+s.id+'">Comments for this section</label><textarea id="n-'+s.id+'" data-n="'+s.id+'" placeholder="Anything else to note?">'+esc(S.n[s.id])+'</textarea>';
h+='</div></details>';
});
h+='<details class="card" id="sec-fin"><summary><span>Action items and sign-off</span><span class="cnt" id="cnt-fin"></span></summary><div class="body"><label class="l" for="m-actions">Action items to follow up</label><textarea id="m-actions" data-m="actions" placeholder="e.g. Re-train team on salad wash. Replace out-of-date stock.">'+esc(S.m.actions)+'</textarea><label class="l" for="m-name">Walk completed by</label><input id="m-name" data-m="name" placeholder="Your name" value="'+esc(S.m.name)+'"><label class="l">Date and time</label><input id="when" readonly></div></details>';
$("#app").innerHTML=h;
SECS.forEach(function(s){s.qs.forEach(function(q,j){if(typeof q!=="string"&&q.temp)tempNote(s.id+j)})});
$("#when").value=new Date().toLocaleString("en-AU",{dateStyle:"full",timeStyle:"short"});
upd();
}
function tempNote(id){
var el=$("#tw-"+id),v=S.t[id];if(!el)return;
if(v===""||v==null){el.textContent="";return}
var n=parseFloat(v);
el.innerHTML=n>5?'<b class="hi">Above 5°C. Flagged.</b>':'<b style="color:var(--ok)">OK</b>';
}
function upd(){
var done=0,total=0,flags=0;
SECS.forEach(function(s){
var d=0;s.qs.forEach(function(q,j){var v=S.a[s.id+j];if(v)d++;if(v==="No")flags++});
done+=d;total+=s.qs.length;
$("#cnt-"+s.id).textContent=d+"/"+s.qs.length;
$("#sec-"+s.id).classList.toggle("done",d===s.qs.length);
});
var f=!!S.m.name.trim();done+=f?1:0;total+=1;
$("#cnt-fin").textContent=f?"Done":"To do";
$("#sec-fin").classList.toggle("done",f);
$("#fill").style.width=(total?done/total*100:0)+"%";
var all=done===total;$("#pdf").disabled=!all;$("#pdf").textContent=all?"Create PDF":"Create PDF (finish all sections first)";
$("#prog").textContent=done+" of "+total+" steps done"+(flags?" · "+flags+" issue"+(flags>1?"s":"")+" flagged":"");
}
$("#app").addEventListener("click",function(e){
var b=e.target.closest("button[data-q]");
if(b){var id=b.dataset.q,v=b.dataset.v;S.a[id]=S.a[id]===v?"":v;
var q=$("#q-"+id);q.querySelectorAll("button").forEach(function(x){x.classList.toggle("on",x.dataset.v===S.a[id])});
q.classList.toggle("flag",S.a[id]==="No");save();upd();return}
var x=e.target.closest("button[data-x]");
if(x){var p=x.dataset.x.split(":");S.p[p[0]].splice(+p[1],1);photos(p[0]);savePh(p[0])}
});
$("#app").addEventListener("input",function(e){
var d=e.target.dataset;
if(d.t){var id=d.t,v=e.target.value;S.t[id]=v;S.a[id]=v===""?"":(parseFloat(v)>5?"No":"Yes");
$("#q-"+id).classList.toggle("flag",S.a[id]==="No");tempNote(id)}
else if(d.qn)S.qn[d.qn]=e.target.value;
else if(d.n)S.n[d.n]=e.target.value;
else if(d.m)S.m[d.m]=e.target.value;
save();upd();
});
$("#app").addEventListener("change",function(e){
var id=e.target.dataset.p;if(!id)return;
var files=Array.prototype.slice.call(e.target.files);e.target.value="";
files.forEach(function(f){shrink(f,function(u){(S.p[id]=S.p[id]||[]).push(u);photos(id);savePh(id)})});
});
function photos(id){
var h="";(S.p[id]||[]).forEach(function(u,i){h+='<div class="ph"><img alt="Photo '+(i+1)+'" src="'+u+'"><button aria-label="Remove photo" data-x="'+id+':'+i+'">×</button></div>'});
var el=$("#ph-"+id);if(el)el.innerHTML=h;
}
function shrink(file,cb){
var rd=new FileReader();
rd.onload=function(){var im=new Image();im.onload=function(){
var m=1000,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");
c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
c.getContext("2d").drawImage(im,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.7))};im.src=rd.result};
rd.readAsDataURL(file);
}
function msg(t,bad){var m=$("#msg");m.textContent=t;m.style.color=bad?"var(--bad)":"var(--ok)"}
function loadImg(u){return new Promise(function(r){var i=new Image();i.onload=function(){r(i)};i.onerror=function(){r(null)};i.src=u})}
function p2(n){return(n<10?"0":"")+n}
async function makePdf(){
var J=window.jspdf&&window.jspdf.jsPDF;
if(!J){msg("The PDF tool did not load. Close and reopen the app.",1);return}
msg("Building PDF...");
var d=new J({unit:"mm",format:"a4"}),M=14,CW=182,y=M,now=new Date();
var BLUE=[0,51,153],YEL=[255,204,0],GREY=[95,102,112],INK=[26,26,26],ACC=BLUE,GREEN=[31,122,77],RED=[179,38,30];
function ens(h){if(y+h>284){d.addPage();y=M}}
function tx(s,x,sz,st,col,w){
col=col||INK;d.setFont("helvetica",st||"normal");d.setFontSize(sz);d.setTextColor(col[0],col[1],col[2]);
var L=d.splitTextToSize(String(s),w),lh=sz*0.44;
L.forEach(function(l){ens(lh);y+=lh;d.text(l,x,y)});
return L.length}
function photoCount(id){return(S.p[id]||[]).length}
var issues=[],tot=0,done=0;
SECS.forEach(function(s){s.qs.forEach(function(q,j){var id=s.id+j;tot++;if(S.a[id])done++;if(S.a[id]==="No")issues.push({s:s,q:q,id:id})})});
d.setFont("helvetica","bold");d.setFontSize(20);d.setTextColor(0,51,153);d.text("Food Safety Walk",M,16);
d.setFont("helvetica","normal");d.setFontSize(10);d.setTextColor(95,102,112);d.text(now.toLocaleString("en-AU",{dateStyle:"full",timeStyle:"short"}),M,23);
d.setFillColor(255,204,0);d.rect(M,26,CW,1.2,"F");y=33;
tx("Completed by: "+S.m.name,M,10,"normal",INK,CW);y+=3;
tx(done+" of "+tot+" questions answered. "+(issues.length?issues.length+" issue"+(issues.length>1?"s":"")+" flagged.":"No issues flagged."),M,11,"bold",issues.length?RED:GREEN,CW);y+=4;
if(issues.length){
tx("Issues flagged",M,13,"bold",BLUE,CW);d.setFillColor(255,204,0);d.rect(M,y+1,30,1,"F");y+=3;
issues.forEach(function(o){
tx(o.s.t+": "+o.q.q,M,10,"bold",INK,CW);
if(o.q.temp)tx("Reading: "+S.t[o.id]+" C",M+4,10,"normal",INK,CW-4);
tx("Note: "+(S.qn[o.id]||"None given"),M+4,10,"normal",INK,CW-4);
if(photoCount(o.id))tx("Photos: "+photoCount(o.id)+" attached below",M+4,10,"normal",GREY,CW-4);
y+=2});
y+=2}
tx("Action items",M,13,"bold",ACC,CW);y+=1;
tx(S.m.actions&&S.m.actions.trim()?S.m.actions:"None recorded.",M,10,"normal",INK,CW);y+=5;
for(var a=0;a<SECS.length;a++){
var s=SECS[a];ens(20);
d.setFont("helvetica","bold");d.setFontSize(12);d.setTextColor(0,51,153);d.text(s.t,M,y+5);d.setFillColor(0,51,153);d.rect(M,y+7,CW,0.5,"F");y+=11;
for(var j=0;j<s.qs.length;j++){
var q=s.qs[j],id=s.id+j,v=S.a[id];
var ans=q.temp?(S.t[id]!==undefined&&S.t[id]!==""?S.t[id]+" C":"-"):(v||"-");
var col=v==="N/A"?GREY:(v==="No"?RED:GREEN);
ens(8);var y0=y;
tx(ans,M,10,"bold",col,24);y=y0;
tx(q.q,M+26,10,"normal",INK,CW-26);
if(v==="No"&&S.qn[id])tx("Note: "+S.qn[id],M+26,9,"italic",INK,CW-26);
var ps=S.p[id]||[];
if(ps.length){
var x=M+26,rh=0;
for(var k=0;k<ps.length;k++){
var im=await loadImg(ps[k]);if(!im)continue;
var sc=Math.min(40/im.width,40/im.height),w=im.width*sc,h=im.height*sc;
if(x+w>M+CW){x=M+26;y+=rh+3;rh=0}
var yb=y;ens(h+2);if(y!==yb){x=M+26;rh=0}
d.addImage(ps[k],"JPEG",x,y+1,w,h);x+=w+3;rh=Math.max(rh,h+1)}
y+=rh+3}
y+=1.5}
if(S.n[s.id]&&S.n[s.id].trim()){tx("Comments: "+S.n[s.id],M,10,"italic",INK,CW);y+=2}
y+=4}
var n=d.getNumberOfPages();
for(var i=1;i<=n;i++){d.setPage(i);d.setFont("helvetica","normal");d.setFontSize(8);d.setTextColor(120,120,120);
d.text("Food Safety Walk | "+now.toLocaleDateString("en-AU")+" | Page "+i+" of "+n,M,291)}
var fn="Food-Safety-Walk-"+now.getFullYear()+"-"+p2(now.getMonth()+1)+"-"+p2(now.getDate())+"-"+p2(now.getHours())+p2(now.getMinutes())+".pdf";
var blob=d.output("blob");
try{var file=new File([blob],fn,{type:"application/pdf"});
if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"Food Safety Walk"});msg("PDF ready to share.");return}}
catch(e){if(e&&e.name==="AbortError"){msg("Share cancelled.");return}}
try{var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fn;document.body.appendChild(a);a.click();a.remove();
setTimeout(function(){URL.revokeObjectURL(a.href)},10000);msg("PDF saved to your downloads.")}
catch(e){msg("Could not save the PDF. Try again.",1)}
}
$("#pdf").addEventListener("click",function(){
this.disabled=true;
makePdf().then(upd,function(){msg("Something went wrong building the PDF.",1);upd()});
});
var DB=null;
function idb(cb){try{var r=indexedDB.open("fsw",1);r.onupgradeneeded=function(){r.result.createObjectStore("p")};r.onsuccess=function(){DB=r.result;cb()};r.onerror=function(){cb()}}catch(e){cb()}}
function savePh(id){if(!DB)return;try{DB.transaction("p","readwrite").objectStore("p").put(S.p[id]||[],id)}catch(e){}}
function clearPh(){if(!DB)return;try{DB.transaction("p","readwrite").objectStore("p").clear()}catch(e){}}
function loadPh(){if(!DB)return;try{var rq=DB.transaction("p","readonly").objectStore("p").openCursor();rq.onsuccess=function(){var c=rq.result;if(c){S.p[c.key]=c.value;photos(c.key);c.continue()}}}catch(e){}}
var armed=0;
$("#reset").addEventListener("click",function(){
var b=this;
if(!armed){armed=1;b.textContent="Tap again to clear this walk";b.style.color="var(--bad)";setTimeout(function(){armed=0;b.textContent="Start new walk";b.style.color=""},4000);return}
try{localStorage.removeItem("fsw3")}catch(e){}
if(DB){try{var t=DB.transaction("p","readwrite");t.objectStore("p").clear();t.oncomplete=function(){location.reload()}}catch(e){location.reload()}}else location.reload();
});
build();
idb(function(){if(FRESH)clearPh();else loadPh()});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
</script>
</body>
</html>
